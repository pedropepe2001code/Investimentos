name: Relatório semanal de investimentos

on:
  schedule:
    - cron: "0 10 * * 1"   # toda segunda, 10:00 UTC = 07:00 em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:        # permite rodar na hora pelo botão "Run workflow"

permissions:
  contents: write
  id-token: write

concurrency:
  group: relatorio-semanal
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Definir data de hoje
        run: echo "HOJE=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_ENV"

      - name: Gerar relatório com Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Hoje é ${{ env.HOJE }}. Leia o arquivo prompts/relatorio_semanal.md e siga TODAS as instruções dele
            para gerar o relatório desta semana.
            Regras de execução (obrigatórias):
            - Salve o relatório EXATAMENTE em: relatorios/relatorio_${{ env.HOJE }}.md (use a ferramenta Write).
            - Para ler arquivos use Read/Glob/Grep; para pesquisar use WebSearch/WebFetch. Não use Bash para nada além de ls e date.
            - Se uma ferramenta ou site for negado/bloqueado, siga com outra fonte e registre a lacuna. NUNCA encerre sem salvar o arquivo.
            - Se o tempo ou os passos estiverem acabando, salve o que tiver (marcando N/D nas lacunas) antes de terminar.
          claude_args: |
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(ls:*),Bash(date:*),Bash(mkdir:*)"
            --max-turns 150

      - name: Guardar cópia do relatório (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ github.run_id }}
          path: relatorios/
          if-no-files-found: ignore

      - name: Salvar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/
          if git diff --cached --quiet; then
            echo "::error::Nenhum relatório novo foi gerado em relatorios/"
            exit 1
          fi
          git commit -m "relatorio: ${HOJE}"
          git pull --rebase origin main
          git push
