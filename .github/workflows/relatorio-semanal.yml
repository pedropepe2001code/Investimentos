name: Relatório semanal de investimentos

on:
  schedule:
    - cron: "0 10 * * 1"   # toda segunda, 10:00 UTC = 07:00 em Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:        # permite rodar na hora pelo botão "Run workflow"

permissions:
  contents: write
  id-token: write

concurrency:
  group: relatorio-semanal
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar relatório com Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Hoje é ${{ github.run_started_at }} (UTC). Leia o arquivo prompts/relatorio_semanal.md
            e siga TODAS as instruções dele à risca para gerar o relatório desta semana.
          claude_args: |
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(ls:*),Bash(date:*)"
            --max-turns 120

      - name: Guardar cópia do relatório (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ github.run_id }}
          path: relatorios/
          if-no-files-found: ignore

      - name: Salvar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/
          if git diff --cached --quiet; then
            echo "::error::Nenhum relatório novo foi gerado em relatorios/"
            exit 1
          fi
          git commit -m "relatorio: $(date -u +%F)"
          git pull --rebase origin main
          git push
